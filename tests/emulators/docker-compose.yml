# Docker Compose for integration test emulators.
# Start with: docker compose -f tests/emulators/docker-compose.yml up -d
#
# Services:
#   - azurite:             Azure Storage Emulator (blob, queue, table)
#   - servicebus-emulator: Azure Service Bus Emulator (queues, topics, subscriptions)
#   - eventhub-emulator:   Azure Event Hub Emulator (hubs, consumer groups)
#   - sqlserver:           SQL Server backing store for the SB and EH emulators

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --silent"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_TEST_PASSWORD:-StrongP@ssw0rd!}"
      MSSQL_MEMORY_LIMIT_MB: "512"
    ports:
      - "127.0.0.1:1433:1433"
    mem_limit: 1g
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest@sha256:76b8127d608fab8287a14a4bfeb9a5502cdcffb4bf1e86f09f324ebb0e70edba
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "${SQL_TEST_PASSWORD:-StrongP@ssw0rd!}"
      ACCEPT_EULA: "Y"
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

  eventhub-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    depends_on:
      azurite:
        condition: service_started
    ports:
      - "127.0.0.2:5672:5672"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    volumes:
      - ./eventhub-emulator-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json

  cosmosdb-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:6ce44ed4ac69cf69a6cb7982d0536cfaa22696172168fc9fe9a722a189d38f99
    ports:
      - "8081:8081"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "2"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
    mem_limit: 3g
