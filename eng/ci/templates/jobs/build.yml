# ---------------------------------------------------------------
# Job Template: Build
# Compiles the Go worker and runs go vet for static analysis.
# ---------------------------------------------------------------

parameters:
  - name: PoolName
    type: string
    default: 1es-pool-azfunc-public

jobs:
  - job: Build
    displayName: 'Build Go Worker'

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    steps:
    - task: GoTool@0
      displayName: 'Install Go 1.25'
      inputs:
        version: '1.25'

    - script: go version
      displayName: 'Print Go version'

    - script: go mod download
      displayName: 'Download dependencies'

    - script: go vet ./...
      displayName: 'Run go vet'

    - script: go build ./...
      displayName: 'Run go build'

    - script: |
        cd middleware/otelfunc && go mod download && go vet ./... && go build ./...
      displayName: 'Build middleware/otelfunc'

    - script: |
        cd otelcollector && go mod download && go vet ./... && go build ./...
      displayName: 'Build otelcollector'

    - script: |
        cd triggers/blob && go mod download && go vet ./... && go build ./...
      displayName: 'Build triggers/blob'
