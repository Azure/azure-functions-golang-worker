# ============================================================
# Unit Tests job for the Go worker.
#
# What this job does:
#   1. Installs Go and sets up a workspace (shared with the Build job).
#   2. Runs golangci-lint (informational — does not fail the build).
#   3. Runs `go test` for the root and each submodule.
#   4. Publishes JUnit test results and Cobertura coverage.
#
# CodeQL note:
#   We turn CodeQL off for this job (via templateContext.sdl.codeql).
#   CodeQL only needs to run once per pipeline, and it already runs
#   on the Build job where a full traced build produces a real
#   database. Running it here would just produce another empty
#   database because `go test` alone doesn't feed the extractor
#   the same way `go build` does.
# ============================================================

parameters:
  - name: PoolName
    type: string
    default: 1es-pool-azfunc-public

jobs:
  - job: UnitTests
    displayName: 'Run Unit Tests'

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    templateContext:
      # Turn off the auto-injected CodeQL tasks for this job.
      # See the "CodeQL note" at the top of this file.
      sdl:
        codeql:
          compiled:
            enabled: false

    steps:
    - task: GoTool@0
      displayName: 'Install Go 1.25'
      inputs:
        version: '1.25'

    # Same workspace setup as the Build job. See eng/ci/templates/jobs/build.yml
    # for why this workspace + genproto replace is needed.
    - script: |
        go work init . ./middleware/otelfunc ./otelcollector ./triggers/blob ./middleware/durabletask
        # Force Go to use the local checkout as the root module instead
        # of downloading an older published copy. See build.yml for the
        # full explanation. The version is read from a submodule's
        # go.mod so releases don't require CI edits.
        ROOT_VER=$(awk '$1=="require" && $2=="github.com/azure/azure-functions-golang-worker" {print $3}' middleware/otelfunc/go.mod)
        echo "Detected root module version: ${ROOT_VER}"
        go work edit -replace github.com/azure/azure-functions-golang-worker@${ROOT_VER}=.
        go work edit -replace google.golang.org/genproto=google.golang.org/genproto@v0.0.0-20250528174236-200df99c418a
        cat go.work
      displayName: 'Initialize go workspace'

    - script: go mod download
      displayName: 'Download dependencies (root)'

    - script: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        go install gotest.tools/gotestsum@latest
        go install github.com/boumenot/gocover-cobertura@latest
      displayName: 'Install test tools'

    - script: |
        export PATH=$PATH:$(go env GOPATH)/bin
        golangci-lint run --config=$(Build.SourcesDirectory)/eng/ci/.golangci.yml --out-format=colored-line-number $(go list ./... | grep -v /samples/) || true
      displayName: 'Run golangci-lint'

    - script: |
        export PATH=$PATH:$(go env GOPATH)/bin
        gotestsum --junitfile $(Build.SourcesDirectory)/test-results.xml -- -coverprofile=$(Build.SourcesDirectory)/coverage.out -covermode=atomic -coverpkg=./worker/...,./sdk/... ./worker/... ./sdk/...
      displayName: 'Run unit tests'

    - script: |
        cd middleware/otelfunc && go test ./...
      displayName: 'Test middleware/otelfunc'

    - script: |
        cd otelcollector && go test ./...
      displayName: 'Test otelcollector'

    - script: |
        cd triggers/blob && go test ./...
      displayName: 'Test triggers/blob'

    - script: |
        cd middleware/durabletask && go test ./...
      displayName: 'Test middleware/durabletask'

    - script: |
        export PATH=$PATH:$(go env GOPATH)/bin
        gocover-cobertura -ignore-gen-files < $(Build.SourcesDirectory)/coverage.out > $(Build.SourcesDirectory)/coverage.xml
      displayName: 'Convert coverage to Cobertura'
      condition: always()

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.SourcesDirectory)/test-results.xml'
        testRunTitle: 'Go Unit Tests'
        mergeTestResults: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish coverage report'
      condition: always()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/coverage.xml'
        additionalCodeCoverageFiles: '$(Build.SourcesDirectory)/coverage.out'
