# ---------------------------------------------------------------
# Azure DevOps Pipeline: Release Submodule Tags
# Manual-trigger only. Given an existing root module tag (e.g. v0.7.0),
# checks out that exact commit, validates each submodule's go.mod, and
# atomically creates matching submodule tags from the same commit so
# every module in this repo is released together.
#
# Release flow:
#   1. Open a "release prep" PR that bumps each submodule's go.mod
#      `require github.com/azure/azure-functions-golang-worker` line
#      to the target version (e.g. v0.7.0).
#   2. Merge the PR. This triggers `golang-worker.official` on the
#      merge commit; wait for it to succeed.
#   3. Create a GitHub release with tag vX.Y.Z pointing at the same
#      merge commit. This is the root module tag.
#   4. Manually queue this pipeline:
#        - Resources -> officialBuild: pick the successful
#          golang-worker.official run from step 2.
#        - rootTag: vX.Y.Z (matching the tag from step 3).
#      The pipeline cross-checks that the picked official run's
#      commit equals the commit pointed at by rootTag before
#      publishing any submodule tags.
#
# The pipeline never produces release notes or binary artifacts;
# release notes are authored once on the GitHub release.
#
# NOTE: this pipeline pushes git tags to the GitHub origin using the
# credentials persisted by the `checkout: self` task. This works when
# the ADO project's GitHub service connection has write scope on the
# repo. If that's not the case, switch the 'Push submodule tags' step
# to fetch a token from Azure Key Vault and push with it explicitly.
# ---------------------------------------------------------------

trigger: none
pr: none

parameters:
  - name: rootTag
    displayName: 'Root module tag (e.g. v0.7.0)'
    type: string

  # Submodules that should receive a matching tag at the same commit
  # as the root tag. To add a new submodule to releases, just append
  # its repo-relative path here.
  - name: submodules
    type: object
    default:
      - middleware/otelfunc
      - otelcollector
      - triggers/blob

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

  # Gating resource: this pipeline can only be queued by selecting a
  # successful run of golang-worker.official. The picked run's
  # sourceCommit is cross-checked against the commit pointed at by
  # rootTag in a later step.
  pipelines:
    - pipeline: officialBuild
      source: golang-worker.official
      trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    featureFlags:
      golang:
        internalModuleProxy:
          enabled: true

    sdl:
      # No binaries are produced or signed; this pipeline only creates
      # and pushes git tags.
      codeSignValidation:
        enabled: false
      codeql:
        compiled:
          enabled: false

    stages:
      - stage: Release
        displayName: 'Release submodule tags'
        jobs:
          - job: TagSubmodules
            displayName: 'Create and push submodule tags'
            pool:
              name: 1es-pool-azfunc
              image: 1es-ubuntu-22.04
              os: linux

            variables:
              - name: rootTag
                value: ${{ parameters.rootTag }}
              # Space-separated list of submodule paths, materialized once
              # from the parameter so every step uses the same source of truth.
              - name: submodules
                value: ${{ join(' ', parameters.submodules) }}

            steps:
              - checkout: self
                fetchTags: true
                fetchDepth: 0
                persistCredentials: true

              - bash: |
                  set -euo pipefail
                  git config user.name "Azure Functions Release Pipeline"
                  git config user.email "azfuncgo-release@noreply.github.com"
                displayName: 'Configure git identity for annotated tags'

              - bash: |
                  set -euo pipefail
                  if ! [[ "$ROOT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                    echo "##vso[task.logissue type=error]Invalid tag format: '$ROOT_TAG'. Expected semver such as 'v0.7.0' or 'v0.7.0-preview'."
                    exit 1
                  fi
                  echo "Root tag validated: $ROOT_TAG"
                  echo "Submodules: $SUBMODULES"
                displayName: 'Validate input tag format'
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  git fetch --tags --force origin
                  if ! git rev-parse "refs/tags/$ROOT_TAG" >/dev/null 2>&1; then
                    echo "##vso[task.logissue type=error]Tag '$ROOT_TAG' does not exist on origin. Create the GitHub release first."
                    exit 1
                  fi
                  COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$ROOT_TAG")
                  echo "Tag '$ROOT_TAG' -> commit $COMMIT_SHA"
                  echo "##vso[task.setvariable variable=commitSha]$COMMIT_SHA"
                displayName: 'Resolve root tag to commit'
                env:
                  ROOT_TAG: $(rootTag)

              - bash: |
                  set -euo pipefail
                  if [ "$OFFICIAL_COMMIT" != "$COMMIT_SHA" ]; then
                    echo "##vso[task.logissue type=error]The selected golang-worker.official run was built from commit $OFFICIAL_COMMIT, but tag $ROOT_TAG points at $COMMIT_SHA. Pick the official run that built the same commit as the tag."
                    exit 1
                  fi
                  echo "Official build commit matches tag commit: $COMMIT_SHA"
                displayName: 'Verify official build ran on the tagged commit'
                env:
                  OFFICIAL_COMMIT: $(resources.pipeline.officialBuild.sourceCommit)
                  COMMIT_SHA: $(commitSha)
                  ROOT_TAG: $(rootTag)

              - bash: |
                  set -euo pipefail
                  git checkout --detach "$COMMIT_SHA"
                  echo "Checked out $COMMIT_SHA"
                displayName: 'Checkout tagged commit'
                env:
                  COMMIT_SHA: $(commitSha)

              - bash: |
                  set -euo pipefail
                  failed=0
                  for module in $SUBMODULES; do
                    gomod="$module/go.mod"
                    echo "--- $gomod ---"
                    if [ ! -f "$gomod" ]; then
                      echo "##vso[task.logissue type=error]$gomod is missing at this commit."
                      failed=1
                      continue
                    fi

                    # Strip block-form 'require ( ... )' wrappers and comments
                    # so a single grep handles both single-line and block forms.
                    if ! awk '
                      /^require[[:space:]]*\(/ {block=1; next}
                      block && /^\)/ {block=0; next}
                      block || /^require[[:space:]]/ {print}
                    ' "$gomod" | grep -E "(^|[[:space:]])github\.com/azure/azure-functions-golang-worker[[:space:]]+${ROOT_TAG}([[:space:]]|$)" >/dev/null; then
                      echo "##vso[task.logissue type=error]$gomod does not require github.com/azure/azure-functions-golang-worker at version $ROOT_TAG."
                      grep -nE "github\.com/azure/azure-functions-golang-worker" "$gomod" || true
                      failed=1
                    else
                      echo "  require: OK"
                    fi

                    if grep -E "^[[:space:]]*replace[[:space:]]+github\.com/azure/azure-functions-golang-worker" "$gomod" >/dev/null; then
                      echo "##vso[task.logissue type=error]$gomod still contains a 'replace' directive for the root module. Remove it before releasing."
                      failed=1
                    else
                      echo "  no root replace: OK"
                    fi
                  done
                  exit $failed
                displayName: 'Validate submodule go.mod files'
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  for module in $SUBMODULES; do
                    subtag="$module/$ROOT_TAG"
                    if git rev-parse "refs/tags/$subtag" >/dev/null 2>&1; then
                      existing=$(git rev-list -n 1 "refs/tags/$subtag")
                      if [ "$existing" != "$COMMIT_SHA" ]; then
                        echo "##vso[task.logissue type=error]Tag $subtag already exists at $existing but expected $COMMIT_SHA."
                        exit 1
                      fi
                      echo "Tag $subtag already at $COMMIT_SHA; skipping."
                    else
                      git tag -a "$subtag" "$COMMIT_SHA" -m "Release $subtag"
                      echo "Created tag $subtag at $COMMIT_SHA"
                    fi
                  done
                displayName: 'Create submodule tags'
                env:
                  ROOT_TAG: $(rootTag)
                  COMMIT_SHA: $(commitSha)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  # Push uses the credentials persisted by `checkout: self` above
                  # (persistCredentials: true). This relies on the ADO project's
                  # GitHub service connection having write scope on the repo.
                  # If the push fails with HTTP 403, the connection is read-only
                  # and the pipeline needs to be reconfigured to use a token
                  # explicitly (e.g. a fine-grained PAT or GitHub App token
                  # fetched from Azure Key Vault).
                  for module in $SUBMODULES; do
                    subtag="$module/$ROOT_TAG"
                    echo "Pushing $subtag"
                    git push origin "refs/tags/$subtag"
                  done
                displayName: 'Push submodule tags to GitHub'
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)
