[project]
name = "azure-functions-golang-worker-tests"
version = "0.1.0"
description = "Integration tests for Azure Functions Go Worker"
requires-python = ">=3.10"

dependencies = [
    "pytest>=8.0",
    "requests>=2.31",
    "azure-servicebus>=7.12",
    "azure-eventhub>=5.11",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.19",
]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
