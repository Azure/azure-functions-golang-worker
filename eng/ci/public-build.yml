# ---------------------------------------------------------------
# Azure DevOps Pipeline: Public Build & Unit Tests
# Runs on PRs and pushes to main. Builds the Go worker and
# executes unit tests with coverage reporting.
# ---------------------------------------------------------------

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-ubuntu-22.04
      os: linux

    sdl:
      codeql:
        compiled:
          enabled: true
        language: go

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
      - stage: Build
        displayName: 'Build & Vet'
        jobs:
          - template: /eng/ci/templates/jobs/build.yml@self

      - stage: UnitTests
        displayName: 'Unit Tests'
        dependsOn: []
        jobs:
          - template: /eng/ci/templates/jobs/unit-tests.yml@self
