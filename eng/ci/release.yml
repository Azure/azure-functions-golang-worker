# ---------------------------------------------------------------
# Azure DevOps Pipeline: Release Module Tags
#
# Manually triggered. Releasing is a deliberate, separately-authorized
# action: only people with permission to run this pipeline in ADO can
# publish tags, even though many people can merge a version bump. This
# keeps "can merge a PR" and "can cut a release" as distinct privileges,
# so a merged change can never publish a release on its own.
#
# When queued, the pipeline:
#   - Requires you to select a successful run of golang-worker.official;
#     that run's commit is the only commit this pipeline will tag (the
#     build gate — you can't release a commit that didn't build).
#   - Reads each submodule's go.mod at that commit and extracts the
#     version they pin for `github.com/azure/azure-functions-golang-worker`.
#   - If all submodules agree on a real semver version (e.g. v0.7.0) and
#     no tag for it exists yet, it tags root + every submodule at that
#     commit and pushes them. Otherwise (mismatch, pseudo-version, or
#     tag already exists) it stops without touching tags.
#
# A release is therefore: a merged PR that bumps every submodule's
# `require github.com/azure/azure-functions-golang-worker` line to the
# new version, followed by a human running this pipeline against the
# official build of that commit. The merge style (merge commit, squash,
# rebase) doesn't matter — the go.mod contents drive the version.
#
# Release flow:
#   1. Open a PR that bumps each submodule's go.mod
#      `require github.com/azure/azure-functions-golang-worker` line to
#      the target version (e.g. vX.Y.Z) and merge it.
#   2. Wait for golang-worker.official to succeed on the merge commit.
#   3. Queue this pipeline. Under "Resources", pick that successful
#      golang-worker.official run. Leave the rootTag parameter empty to
#      detect the version from go.mod, or set it to force a version.
#   4. The pipeline validates the go.mod files and creates + pushes the
#      root tag vX.Y.Z plus matching submodule tags from the same commit.
#   5. A human creates the GitHub Release with notes at
#      https://github.com/Azure/azure-functions-golang-worker/releases/new?tag=vX.Y.Z
#      (the URL is printed at the end of the pipeline run).
#
# rootTag override: set the rootTag parameter to force a specific
# version instead of detecting it from go.mod. Use to re-publish a
# failed run, or to release from a commit whose go.mod files weren't
# updated as part of the change. The selected official run's commit is
# still the only commit that gets tagged.
#
# This pipeline never produces release notes or binary artifacts;
# release notes are authored once on the GitHub release.
#
# NOTE: this pipeline pushes git tags to the GitHub origin using the
# credentials persisted by the `checkout: self` task. This works when
# the ADO project's GitHub service connection has write scope on the
# repo. If that's not the case, switch the 'Push release tags' step
# to fetch a token from Azure Key Vault and push with it explicitly.
# ---------------------------------------------------------------

trigger: none
pr: none

parameters:
  # Optional version override. Leave empty for the normal flow: the
  # version is detected from the submodule go.mod files at the selected
  # official build's commit. Set this to force a specific version
  # (re-publish a failed run, or release a commit whose go.mod files
  # weren't updated as part of the change).
  - name: rootTag
    displayName: 'Root module version override (e.g. v0.7.0) — leave empty to detect from go.mod'
    type: string
    default: ''

  # Submodules that should receive a matching tag at the same commit
  # as the root tag. To add a new submodule to releases, just append
  # its repo-relative path here.
  - name: submodules
    type: object
    default:
      - middleware/otelfunc
      - otelcollector
      - triggers/blob

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

  # Gating resource: this pipeline can only be queued by selecting a
  # successful run of golang-worker.official. That run's commit is the
  # only commit this pipeline will tag, so you can never release a commit
  # that didn't pass an official build. Manual trigger only (trigger:
  # none) — releasing is a deliberate action, not a side effect of
  # merging a version bump.
  pipelines:
    - pipeline: officialBuild
      source: golang-worker.official
      trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    featureFlags:
      golang:
        internalModuleProxy:
          enabled: true

    sdl:
      # No binaries are produced or signed; this pipeline only creates
      # and pushes git tags.
      codeSignValidation:
        enabled: false
      codeql:
        compiled:
          enabled: false

    stages:
      - stage: Release
        displayName: 'Release modules'
        jobs:
          - job: TagSubmodules
            displayName: 'Detect release and tag modules'
            pool:
              name: 1es-pool-azfunc
              image: 1es-ubuntu-22.04
              os: linux

            variables:
              # Optional version override from the queue-time parameter.
              # Empty for the normal flow (version detected from go.mod);
              # non-empty when an operator is forcing a specific version.
              - name: rootTagOverride
                value: ${{ parameters.rootTag }}
              # Commit the selected golang-worker.official run was built
              # from. This is the only commit this pipeline will tag.
              - name: officialCommit
                value: $(resources.pipeline.officialBuild.sourceCommit)
              # Space-separated list of submodule paths, materialized once
              # from the parameter so every step uses the same source of truth.
              - name: submodules
                value: ${{ join(' ', parameters.submodules) }}

            steps:
              - checkout: self
                fetchTags: true
                fetchDepth: 0
                persistCredentials: true

              - bash: |
                  set -euo pipefail
                  git config user.name "Azure Functions Release Pipeline"
                  git config user.email "azfuncgo-release@noreply.github.com"
                displayName: 'Configure git identity for annotated tags'

              # Decides whether this run should tag anything and resolves the
              # version + target commit. Two modes:
              #
              #   Override:  rootTagOverride is non-empty. Use it as the
              #              version. The target commit is the selected
              #              official run's commit.
              #
              #   Detect (no override): read the pinned root-module version
              #              from each submodule's go.mod at the official
              #              build commit. If all submodules agree on a
              #              proper semver version and no tag for it exists
              #              yet, release this commit as that version.
              #              Otherwise stop cleanly without touching tags.
              #              This works the same for merge, squash, and
              #              rebase commits because the source of truth is
              #              the file contents, not the commit message.
              #
              # Sets job-scoped variables: shouldRelease, rootTag, commitSha.
              - bash: |
                  set -euo pipefail

                  echo "rootTagOverride=$ROOT_TAG_OVERRIDE"
                  echo "officialCommit=$OFFICIAL_COMMIT"
                  echo "submodules=$SUBMODULES"

                  if [ -z "$OFFICIAL_COMMIT" ]; then
                    echo "##vso[task.logissue type=error]No official build sourceCommit available. This pipeline must be queued via the golang-worker.official resource."
                    exit 1
                  fi

                  # Make sure the commit and existing tags are present locally.
                  git fetch origin "$OFFICIAL_COMMIT" --depth=1 2>/dev/null || true
                  git fetch --tags origin 2>/dev/null || true

                  if [ -n "$ROOT_TAG_OVERRIDE" ]; then
                    echo "Mode: version override"
                    ROOT_TAG="$ROOT_TAG_OVERRIDE"
                  else
                    echo "Mode: detect version from submodule go.mod files"

                    # Read the version each submodule pins for the root module.
                    # All submodules must agree; if they don't, this isn't a
                    # release commit (e.g. a mid-flight commit that only
                    # touched one submodule).
                    extract_root_version() {
                      # Reads stdin (a go.mod file), prints the version that
                      # the root module is required at, or nothing if absent.
                      # Handles both `require github.com/... vX.Y.Z` and the
                      # `require ( ... )` block form.
                      awk '
                        /^require[[:space:]]*\(/ {in_block=1; next}
                        in_block && /^\)/ {in_block=0; next}
                        /^require[[:space:]]+github\.com\/azure\/azure-functions-golang-worker[[:space:]]+/ {
                          print $3; exit
                        }
                        in_block && $1 == "github.com/azure/azure-functions-golang-worker" {
                          print $2; exit
                        }
                      '
                    }

                    DETECTED_VER=""
                    INCONSISTENT=0
                    for module in $SUBMODULES; do
                      gomod="$module/go.mod"
                      ver=$(git show "$OFFICIAL_COMMIT:$gomod" 2>/dev/null | extract_root_version || true)
                      if [ -z "$ver" ]; then
                        echo "  $gomod: no root-module require line"
                        INCONSISTENT=1
                        continue
                      fi
                      if [ -z "$DETECTED_VER" ]; then
                        DETECTED_VER="$ver"
                        echo "  $gomod: $ver"
                      elif [ "$DETECTED_VER" != "$ver" ]; then
                        echo "  $gomod: $ver (disagrees with $DETECTED_VER)"
                        INCONSISTENT=1
                      else
                        echo "  $gomod: $ver"
                      fi
                    done

                    if [ "$INCONSISTENT" = "1" ] || [ -z "$DETECTED_VER" ]; then
                      echo "Submodules disagree or no version detected; not a release commit."
                      echo "##vso[task.setvariable variable=shouldRelease]false"
                      exit 0
                    fi

                    # Skip pseudo-versions (vX.Y.Z-YYYYMMDDHHMMSS-abcdef123456),
                    # which `go get @<branch-or-commit>` writes. These are never
                    # real release targets.
                    if [[ "$DETECTED_VER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{14}- ]]; then
                      echo "Detected pseudo-version $DETECTED_VER; not a release commit."
                      echo "##vso[task.setvariable variable=shouldRelease]false"
                      exit 0
                    fi

                    # If a tag for this version already exists, nothing to do.
                    # This is the common case: every subsequent commit on main
                    # still pins to the last released version.
                    if git rev-parse "refs/tags/$DETECTED_VER" >/dev/null 2>&1; then
                      existing=$(git rev-list -n 1 "refs/tags/$DETECTED_VER")
                      echo "Tag $DETECTED_VER already exists at $existing; nothing to do."
                      echo "##vso[task.setvariable variable=shouldRelease]false"
                      exit 0
                    fi

                    ROOT_TAG="$DETECTED_VER"
                    echo "Detected new release version: $ROOT_TAG"
                  fi

                  echo "##vso[task.setvariable variable=shouldRelease]true"
                  echo "##vso[task.setvariable variable=rootTag]$ROOT_TAG"
                  echo "##vso[task.setvariable variable=commitSha]$OFFICIAL_COMMIT"
                  echo "Resolved rootTag=$ROOT_TAG commitSha=$OFFICIAL_COMMIT"
                displayName: 'Detect release version and target commit'
                env:
                  ROOT_TAG_OVERRIDE: $(rootTagOverride)
                  OFFICIAL_COMMIT: $(officialCommit)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  if ! [[ "$ROOT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                    echo "##vso[task.logissue type=error]Invalid tag format: '$ROOT_TAG'. Expected semver such as 'v0.7.0' or 'v0.7.0-preview'."
                    exit 1
                  fi
                  echo "Root tag validated: $ROOT_TAG"
                  echo "Submodules: $SUBMODULES"
                displayName: 'Validate tag format'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  git fetch --tags --force origin "$COMMIT_SHA"
                  git checkout --detach "$COMMIT_SHA"
                  echo "Checked out $COMMIT_SHA"
                displayName: 'Checkout release commit'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  COMMIT_SHA: $(commitSha)

              - bash: |
                  set -euo pipefail
                  failed=0
                  for module in $SUBMODULES; do
                    gomod="$module/go.mod"
                    echo "--- $gomod ---"
                    if [ ! -f "$gomod" ]; then
                      echo "##vso[task.logissue type=error]$gomod is missing at this commit."
                      failed=1
                      continue
                    fi

                    # Strip block-form 'require ( ... )' wrappers and comments
                    # so a single grep handles both single-line and block forms.
                    if ! awk '
                      /^require[[:space:]]*\(/ {block=1; next}
                      block && /^\)/ {block=0; next}
                      block || /^require[[:space:]]/ {print}
                    ' "$gomod" | grep -E "(^|[[:space:]])github\.com/azure/azure-functions-golang-worker[[:space:]]+${ROOT_TAG}([[:space:]]|$)" >/dev/null; then
                      echo "##vso[task.logissue type=error]$gomod does not require github.com/azure/azure-functions-golang-worker at version $ROOT_TAG."
                      grep -nE "github\.com/azure/azure-functions-golang-worker" "$gomod" || true
                      failed=1
                    else
                      echo "  require: OK"
                    fi

                    if grep -E "^[[:space:]]*replace[[:space:]]+github\.com/azure/azure-functions-golang-worker" "$gomod" >/dev/null; then
                      echo "##vso[task.logissue type=error]$gomod still contains a 'replace' directive for the root module. Remove it before releasing."
                      failed=1
                    else
                      echo "  no root replace: OK"
                    fi
                  done
                  exit $failed
                displayName: 'Validate submodule go.mod files'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)

              # Idempotent: creates the tag if missing, verifies the commit
              # if present. Same loop handles root and every submodule.
              - bash: |
                  set -euo pipefail

                  create_tag() {
                    local tag="$1"
                    if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
                      local existing
                      existing=$(git rev-list -n 1 "refs/tags/$tag")
                      if [ "$existing" != "$COMMIT_SHA" ]; then
                        echo "##vso[task.logissue type=error]Tag $tag already exists at $existing but expected $COMMIT_SHA."
                        return 1
                      fi
                      echo "  $tag already at $COMMIT_SHA; skipping creation."
                    else
                      git tag -a "$tag" "$COMMIT_SHA" -m "Release $tag"
                      echo "  created $tag at $COMMIT_SHA"
                    fi
                  }

                  echo "Root tag:"
                  create_tag "$ROOT_TAG"

                  echo "Submodule tags:"
                  for module in $SUBMODULES; do
                    create_tag "$module/$ROOT_TAG"
                  done
                displayName: 'Create release tags'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  ROOT_TAG: $(rootTag)
                  COMMIT_SHA: $(commitSha)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  # Push uses the credentials persisted by `checkout: self` above
                  # (persistCredentials: true). This relies on the ADO project's
                  # GitHub service connection having write scope on the repo.
                  # If the push fails with HTTP 403, the connection is read-only
                  # and the pipeline needs to be reconfigured to use a token
                  # explicitly (e.g. a fine-grained PAT or GitHub App token
                  # fetched from Azure Key Vault).
                  push_tag() {
                    local tag="$1"
                    echo "Pushing $tag"
                    git push origin "refs/tags/$tag"
                  }

                  push_tag "$ROOT_TAG"
                  for module in $SUBMODULES; do
                    push_tag "$module/$ROOT_TAG"
                  done
                displayName: 'Push release tags to GitHub'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  ROOT_TAG: $(rootTag)
                  SUBMODULES: $(submodules)

              - bash: |
                  set -euo pipefail
                  echo ""
                  echo "============================================================"
                  echo "Tags published. To publish release notes, create the GitHub"
                  echo "Release at:"
                  echo "  https://github.com/Azure/azure-functions-golang-worker/releases/new?tag=$ROOT_TAG"
                  echo "============================================================"
                displayName: 'Next steps: create GitHub Release'
                condition: and(succeeded(), eq(variables.shouldRelease, 'true'))
                env:
                  ROOT_TAG: $(rootTag)
